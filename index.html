<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÇağfenCraft: English Quest (Own It 2)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background-color: #87CEEB;}
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; text-align: center; color: white; text-shadow: 2px 2px 0 #000; display: none; }
        h1 { margin-top: 20px; color: #55FF55; }
        #question-box { background: rgba(0,0,0,0.8); display: inline-block; padding: 20px; border-radius: 10px; margin-top: 20px; border: 4px solid #fff; font-size: 24px; max-width: 80%; }
        #score-board { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 5px; font-size: 20px; border: 2px solid white; }
        #leaderboard { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 5px; text-align: left; border: 2px solid white; }
        .instructions { position: absolute; bottom: 30px; width: 100%; text-align: center; font-size: 20px; color: #ffffaa;}
        
        #login-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://www.transparenttextures.com/patterns/cubes.png'), #5D4037; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 10; }
        .login-box { background: #E0E0E0; padding: 40px; border-radius: 10px; border: 6px solid #333; text-align: center; box-shadow: 10px 10px 0px rgba(0,0,0,0.5); }
        .login-box h2 { margin-top: 0; color: #333; font-size: 28px; }
        .login-box input { padding: 12px; font-size: 20px; font-family: inherit; border: 3px solid #777; width: 80%; text-align: center; margin-bottom: 15px; }
        .login-box button { padding: 12px 25px; font-size: 22px; cursor: pointer; background: #4CAF50; color: white; border: 3px solid #2E7D32; font-family: inherit; font-weight: bold; transition: 0.2s; }
        .login-box button:hover { background: #45a049; transform: scale(1.05); }
    </style>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <!-- Three.js (3D Motoru) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2>🏫 Çağfen Koleji'ne Hoş Geldin!</h2>
        <p style="font-size:18px; color:#555;">Own It 2 - Unit 1 Macerası</p>
        <input type="text" id="playerName" placeholder="Adını ve Soyadını gir..."><br>
        <button onclick="startGame()">Oyuna Başla</button>
    </div>
</div>

<div id="ui-layer">
    <h1>ÇağfenCraft: English Quest</h1>
    <div id="score-board">Skor: <span id="score">0</span></div>
    <div id="leaderboard"><strong>🏆 Liderlik Tablosu</strong><br><ul id="lb-list" style="list-style:none; padding:0; margin:10px 0 0 0;"></ul></div>
    <div id="question-box">Yükleniyor...</div>
    <div class="instructions">Doğru cevabın yazdığı bloğa (Kırmızı veya Mavi) tıkla!</div>
</div>

<script>
// ==========================================
// 1. FIREBASE VERİTABANI BAĞLANTISI
// ==========================================
const firebaseConfig = {
    apiKey: "BURAYA_KENDI_API_KEY_INI_YAZ",
    authDomain: "proje-adi.firebaseapp.com",
    databaseURL: "https://proje-adi-default-rtdb.firebaseio.com",
    projectId: "proje-adi",
    storageBucket: "proje-adi.appspot.com",
    messagingSenderId: "123456789",
    appId: "BURAYA_APP_ID_YAZ"
};

let db;
try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
} catch(e) {
    console.warn("Firebase bağlantısı yok. Oyun çevrimdışı modda çalışıyor.");
}

// ==========================================
// 2. OWN IT 2 İNGİLİZCE SORULARI (Sayfa 2-21)
// ==========================================
// ==========================================
// 2. SORULAR (Own It! 2, Sayfa 2-21) - 100 Soru
// ==========================================
const questions = [
    // BÖLÜM 1: Present Simple (Geniş Zaman / Rutinler)
    { q: "I ____ (hang out) with my friends at the weekend.", a: "hang out", b: "am hanging out", correct: 1 },
    { q: "She always ____ (go) to bed at 10:30 PM.", a: "goes", b: "go", correct: 1 },
    { q: "We usually ____ (play) video games after school.", a: "play", b: "are playing", correct: 1 },
    { q: "He ____ (not like) watching reality shows.", a: "don't like", b: "doesn't like", correct: 2 },
    { q: "Do you ____ (listen) to music every day?", a: "listen", b: "listening", correct: 1 },
    { q: "My father ____ (read) the news every morning.", a: "reads", b: "is reading", correct: 1 },
    { q: "They never ____ (eat) fast food.", a: "eats", b: "eat", correct: 2 },
    { q: "____ your brother play basketball?", a: "Do", b: "Does", correct: 2 },
    { q: "I often ____ (order) İskender kebap for dinner.", a: "order", b: "orders", correct: 1 },
    { q: "Water ____ (boil) at 100 degrees.", a: "is boiling", b: "boils", correct: 2 },
    { q: "Our teachers ____ (give) us homework on Fridays.", a: "give", b: "gives", correct: 1 },
    { q: "She ____ (not ride) her electric scooter to school.", a: "doesn't ride", b: "don't ride", correct: 1 },
    { q: "How often ____ you go to the cinema?", a: "do", b: "are", correct: 1 },
    { q: "Kamuran ____ (live) in Eskişehir.", a: "lives", b: "live", correct: 1 },
    { q: "Cats ____ (sleep) a lot during the day.", a: "sleeps", b: "sleep", correct: 2 },
    { q: "____ they usually chat online?", a: "Are", b: "Do", correct: 2 },
    { q: "I ____ (not know) the answer to this question.", a: "not know", b: "don't know", correct: 2 },
    { q: "He always ____ (wear) a Galatasaray jersey on match days.", a: "wears", b: "wear", correct: 1 },
    { q: "We ____ (have) English classes on Mondays.", a: "has", b: "have", correct: 2 },
    { q: "The library ____ (open) at 8:00 AM.", a: "opens", b: "open", correct: 1 },

    // BÖLÜM 2: Present Continuous (Şimdiki Zaman / Şu An)
    { q: "Look! She ____ (watch) a documentary right now.", a: "watches", b: "is watching", correct: 2 },
    { q: "Shh! The baby ____ (sleep).", a: "is sleeping", b: "sleeps", correct: 1 },
    { q: "I ____ (play) Valorant at the moment, I can't come.", a: "play", b: "am playing", correct: 2 },
    { q: "They ____ (not study) right now; they are chatting.", a: "aren't studying", b: "don't study", correct: 1 },
    { q: "Listen! Someone ____ (knock) on the door.", a: "is knocking", b: "knocks", correct: 1 },
    { q: "____ you watching a cartoon right now?", a: "Are", b: "Do", correct: 1 },
    { q: "He ____ (run) in the park at the moment.", a: "is running", b: "runs", correct: 1 },
    { q: "We ____ (build) a new house in Minecraft now.", a: "build", b: "are building", correct: 2 },
    { q: "What ____ you doing?", a: "do", b: "are", correct: 2 },
    { q: "It ____ (rain) outside. Take your umbrella!", a: "is raining", b: "rains", correct: 1 },
    { q: "My sister ____ (talk) on Discord right now.", a: "is talking", b: "talks", correct: 1 },
    { q: "They ____ (fly) to Bodrum today.", a: "fly", b: "are flying", correct: 2 },
    { q: "I ____ (wait) for my food delivery from Yemeksepeti.", a: "am waiting", b: "wait", correct: 1 },
    { q: "____ he doing his homework at the moment?", a: "Is", b: "Does", correct: 1 },
    { q: "The students ____ (listen) to the teacher right now.", a: "are listening", b: "listen", correct: 1 },
    { q: "Why ____ you crying?", a: "do", b: "are", correct: 2 },
    { q: "I ____ (print) a model on my 3D printer now.", a: "print", b: "am printing", correct: 2 },
    { q: "She ____ (not wear) her headphones right now.", a: "isn't wearing", b: "doesn't wear", correct: 1 },
    { q: "We ____ (drive) our electric vehicle at the moment.", a: "drive", b: "are driving", correct: 2 },
    { q: "Who ____ (play) War Thunder over there?", a: "plays", b: "is playing", correct: 2 },

    // BÖLÜM 3: State Verbs & Like / Love / Hate (Durum Fiilleri)
    { q: "I ____ (love) playing video games.", a: "am loving", b: "love", correct: 2 },
    { q: "He ____ (want) to buy a new gaming mouse.", a: "wants", b: "is wanting", correct: 1 },
    { q: "Do you ____ (understand) this rule?", a: "understanding", b: "understand", correct: 2 },
    { q: "She ____ (hate) reality shows.", a: "hates", b: "is hating", correct: 1 },
    { q: "We ____ (need) some wood in Minecraft.", a: "need", b: "are needing", correct: 1 },
    { q: "I don't mind ____ (take) photos.", a: "to take", b: "taking", correct: 2 },
    { q: "They enjoy ____ (watch) sports programmes.", a: "watching", b: "to watch", correct: 1 },
    { q: "He is mad ____ football!", a: "about", b: "for", correct: 1 },
    { q: "Are you interested ____ 3D printing?", a: "on", b: "in", correct: 2 },
    { q: "I can't stand ____ (listen) to pop music.", a: "listening", b: "to listen", correct: 1 },
    { q: "She prefers ____ (read) books to watching TV.", a: "reading", b: "read", correct: 1 },
    { q: "I ____ (think) this game is awesome.", a: "think", b: "am thinking", correct: 1 },
    { q: "This soup ____ (smell) delicious.", a: "smells", b: "is smelling", correct: 1 },
    { q: "Do you ____ (know) the answer?", a: "know", b: "knowing", correct: 1 },
    { q: "I really like ____ (hang out) at the mall.", a: "hanging out", b: "hang out", correct: 1 },
    { q: "She ____ (believe) in ghosts.", a: "believes", b: "is believing", correct: 1 },
    { q: "We ____ (prefer) action movies.", a: "prefer", b: "are preferring", correct: 1 },
    { q: "He loves ____ (play) chess.", a: "playing", b: "play", correct: 1 },
    { q: "I don't ____ (remember) his name.", a: "remembering", b: "remember", correct: 2 },
    { q: "Are you good ____ playing the guitar?", a: "at", b: "in", correct: 1 },

    // BÖLÜM 4: Vocabulary - Hobbies & Free Time (Hobiler)
    { q: "You use ____ to listen to music privately.", a: "headphones", b: "a passport", correct: 1 },
    { q: "I usually ____ online with my friends on Discord.", a: "chat", b: "take", correct: 1 },
    { q: "My hobby is ____ photos of nature.", a: "making", b: "taking", correct: 2 },
    { q: "Let's ____ out at the park this afternoon.", a: "hang", b: "play", correct: 1 },
    { q: "He likes to ____ video games like Valorant.", a: "make", b: "play", correct: 2 },
    { q: "I use a camera to ____ photos.", a: "take", b: "do", correct: 1 },
    { q: "Do you ____ sports on the weekend?", a: "make", b: "do", correct: 2 },
    { q: "She loves to ____ shopping on Saturdays.", a: "go", b: "do", correct: 1 },
    { q: "I need to ____ my homework before dinner.", a: "do", b: "make", correct: 1 },
    { q: "We often ____ a movie together.", a: "look", b: "watch", correct: 2 },
    { q: "Can you ____ the guitar?", a: "play", b: "do", correct: 1 },
    { q: "I want to ____ a new language.", a: "learn", b: "read", correct: 1 },
    { q: "They usually ____ to music on the bus.", a: "listen", b: "hear", correct: 1 },
    { q: "My friend likes to ____ books.", a: "read", b: "watch", correct: 1 },
    { q: "I sometimes ____ pictures in my free time.", a: "draw", b: "play", correct: 1 },
    { q: "Do you want to ____ a board game?", a: "play", b: "do", correct: 1 },
    { q: "He is learning to ____ a horse.", a: "drive", b: "ride", correct: 2 },
    { q: "I love to ____ in the sea during summer.", a: "swim", b: "fly", correct: 1 },
    { q: "Let's ____ a cake for her birthday.", a: "make", b: "do", correct: 1 },
    { q: "I use my computer to ____ the internet.", a: "surf", b: "drive", correct: 1 },

    // BÖLÜM 5: Vocabulary - TV Shows (Televizyon Programları)
    { q: "A programme about real life, animals, or history is a ____.", a: "documentary", b: "comedy", correct: 1 },
    { q: "SpongeBob SquarePants is a popular ____.", a: "cartoon", b: "news", correct: 1 },
    { q: "A show where people play games to win money is a ____.", a: "game show", b: "soap opera", correct: 1 },
    { q: "I watch the ____ every evening to see what is happening in the world.", a: "news", b: "sitcom", correct: 1 },
    { q: "A programme that tells you if it will rain is the ____.", a: "weather forecast", b: "reality show", correct: 1 },
    { q: "A dramatic TV series about the daily lives of the same characters is a ____.", a: "soap opera", b: "documentary", correct: 1 },
    { q: "A show where normal people live together and are filmed is a ____.", a: "reality show", b: "cartoon", correct: 1 },
    { q: "A funny TV series with the same characters is a ____.", a: "sitcom", b: "news", correct: 1 },
    { q: "I love watching the football ____ on Saturday night.", a: "sports programme", b: "weather forecast", correct: 1 },
    { q: "A show where a presenter interviews famous people is a ____.", a: "talk show", b: "game show", correct: 1 },
    { q: "My little brother loves watching ____.", a: "cartoons", b: "documentaries", correct: 1 },
    { q: "Did you watch the ____ about lions on TV?", a: "documentary", b: "sitcom", correct: 1 },
    { q: "The ____ says it will be sunny tomorrow.", a: "weather forecast", b: "soap opera", correct: 1 },
    { q: "My grandmother watches a ____ every afternoon.", a: "soap opera", b: "sports programme", correct: 1 },
    { q: "Survivor is a famous ____.", a: "reality show", b: "news", correct: 1 },
    { q: "They won a car on a ____ last week.", a: "game show", b: "cartoon", correct: 1 },
    { q: "The ____ starts at 8:00 PM on Channel 4.", a: "news", b: "sitcom", correct: 1 },
    { q: "He always laughs at that ____.", a: "sitcom", b: "documentary", correct: 1 },
    { q: "The late-night ____ had a famous actor as a guest.", a: "talk show", b: "weather forecast", correct: 1 },
    { q: "We are watching a ____ about basketball.", a: "sports programme", b: "soap opera", correct: 1 }
];

let currentQuestion = 0;
let score = 0;
let playerName = "";

// ==========================================
// 3. THREE.JS İLE 3D MİNECRAFT DÜNYASI
// ==========================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // Gökyüzü

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Işıklar
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 7).normalize();
scene.add(light);
scene.add(new THREE.AmbientLight(0x555555)); 

// Çimen Zemin (Minecraft Stili)
const grassGeometry = new THREE.BoxGeometry(40, 1, 40);
const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
const grass = new THREE.Mesh(grassGeometry, grassMaterial);
grass.position.y = -1.5;
scene.add(grass);

// Kenar Çizgileri Fonksiyonu (Blokların etrafındaki siyah çizgiler)
function addEdges(mesh) {
    const edges = new THREE.EdgesGeometry(mesh.geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
    mesh.add(line);
}
addEdges(grass);

// Cevap Blokları (Kırmızı ve Mavi)
const boxGeo = new THREE.BoxGeometry(2, 2, 2);

const blockA = new THREE.Mesh(boxGeo, new THREE.MeshLambertMaterial({ color: 0xff4444 }));
blockA.position.set(-3, 1, -6);
blockA.name = "A";
addEdges(blockA);
scene.add(blockA);

const blockB = new THREE.Mesh(boxGeo, new THREE.MeshLambertMaterial({ color: 0x4444ff }));
blockB.position.set(3, 1, -6);
blockB.name = "B";
addEdges(blockB);
scene.add(blockB);

camera.position.z = 3;
camera.position.y = 2;

// Tıklama Algılayıcı (Raycaster)
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function startGame() {
    const input = document.getElementById("playerName").value;
    if(input.trim() === "") return alert("Lütfen adını gir!");
    playerName = input;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("ui-layer").style.display = "block";
    document.getElementById("ui-layer").style.pointerEvents = "auto";
    
    loadQuestion();
    loadLeaderboard();
}

function loadQuestion() {
    if(currentQuestion >= questions.length) {
        document.getElementById("question-box").innerHTML = "🎉 Harika! Tüm soruları bitirdin!";
        saveScore();
        return;
    }
    const q = questions[currentQuestion];
    document.getElementById("question-box").innerHTML = `
        ${q.q}<br><br>
        <span style="color:#ff6666; text-shadow:1px 1px 0 #000;">Sol (Kırmızı): ${q.a}</span> 
        &nbsp;&nbsp;&nbsp;&nbsp; 
        <span style="color:#6666ff; text-shadow:1px 1px 0 #000;">Sağ (Mavi): ${q.b}</span>
    `;
}

// Oyuncu Bloğa Tıkladığında
window.addEventListener('click', (event) => {
    if(document.getElementById("login-screen").style.display !== "none") return;

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects([blockA, blockB]);
    
    if (intersects.length > 0) {
        const clickedBlock = intersects[0].object.name;
        checkAnswer(clickedBlock === "A" ? 1 : 2);
    }
});

function checkAnswer(selected) {
    if(currentQuestion >= questions.length) return;
    
    const block = selected === 1 ? blockA : blockB;
    // Tıklama animasyonu
    block.scale.set(0.8, 0.8, 0.8);
    setTimeout(() => block.scale.set(1, 1, 1), 150);

    if(selected === questions[currentQuestion].correct) {
        score += 10;
        document.getElementById("score").innerText = score;
        currentQuestion++;
        loadQuestion();
    } else {
        alert("Oops! Yanlış cevap. Tekrar dene.");
    }
}

// Skoru Firebase'e Kaydet
function saveScore() {
    if(!db) return;
    db.ref("cagfen_leaderboard/" + playerName).set({
        score: score,
        time: Date.now()
    });
}

// Liderlik Tablosunu Canlı Çek
function loadLeaderboard() {
    if(!db) return;
    db.ref("cagfen_leaderboard").orderByChild("score").limitToLast(5).on("value", (snapshot) => {
        const list = document.getElementById("lb-list");
        list.innerHTML = "";
        let scores = [];
        snapshot.forEach((child) => { scores.push({name: child.key, score: child.val().score}); });
        scores.reverse(); 
        scores.forEach(s => {
            list.innerHTML += `<li>⭐ ${s.name}: ${s.score} Puan</li>`;
        });
    });
}

// Animasyon Döngüsü
function animate() {
    requestAnimationFrame(animate);
    // Bloklara nefes alma / yavaş dönme efekti
    blockA.rotation.y += 0.005;
    blockA.position.y = 1 + Math.sin(Date.now() * 0.002) * 0.2;
    
    blockB.rotation.y -= 0.005;
    blockB.position.y = 1 + Math.cos(Date.now() * 0.002) * 0.2;

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
});
</script>
</body>
</html>
